<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HBOT // Tactical Control Station</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-panel: #111827;
      --bg-card: #1f293d;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .hero-title {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    .btn-launch {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.4);
    }

    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand { font-weight: 800; font-size: 1.25rem; }
    .nav-brand span { color: var(--accent-cyan); }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: rgba(255,255,255,0.05);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
    }
    .indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-rose); }
    .indicator.online { background: var(--accent-emerald); box-shadow: 0 0 10px var(--accent-emerald); }

    .tab-bar {
      display: flex;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 24px;
      gap: 12px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 14px 18px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); }

    main { flex: 1; padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .page { display: none; }
    .page.active { display: block; }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .btn-ble {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
    }

    .drive-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 280px;
      margin: 20px auto;
    }

    .btn-ctrl {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: white;
      padding: 20px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-ctrl:active { background: var(--accent-cyan); color: black; }
    .btn-stop { background: var(--accent-rose) !important; color: white !important; }

    .arm-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-family: var(--font-mono);
      font-weight: 700;
      width: 100%;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .arm-btn:active { background: var(--accent-cyan); color: black; }

    .port-info {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(6,182,212,0.1);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <h1 class="hero-title">HBOT COMMAND</h1>
    <p style="color:var(--text-sub); margin-bottom:24px;">Direct Port C & E Driving Control System</p>
    <button class="btn-launch" onclick="launchApp()">INITIALIZE SYSTEM</button>
  </div>

  <header>
    <div class="nav-brand">HBOT <span>// HUB</span></div>
    <div class="status-badge">
      <div id="ble-indicator" class="indicator"></div>
      <span id="ble-text">OFFLINE</span>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchPage('page-overview', this)">OVERVIEW</button>
    <button class="tab-btn" onclick="switchPage('page-control', this)">MOTOR CONTROLS</button>
  </div>

  <main>
    <!-- OVERVIEW PAGE -->
    <div id="page-overview" class="page active">
      <div class="card">
        <h3 style="margin-bottom:12px;">System Link</h3>
        <div class="port-info">ACTIVE PORTS: DRIVE = C & E | ARM = A</div>
        <button class="btn-ble" onclick="connectLegoHub()">CONNECT HBOT SPIKE HUB</button>
      </div>
    </div>

    <!-- MOTOR CONTROLS PAGE -->
    <div id="page-control" class="page">
      <div class="card">
        <h3>Drive Motors (Port C & Port E)</h3>
        <div class="drive-pad">
          <div></div>
          <button class="btn-ctrl" onclick="moveDrive(60, 60)">▲</button>
          <div></div>
          <button class="btn-ctrl" onclick="moveDrive(-60, 60)">◀</button>
          <button class="btn-ctrl btn-stop" onclick="moveDrive(0, 0)">■</button>
          <button class="btn-ctrl" onclick="moveDrive(60, -60)">▶</button>
          <div></div>
          <button class="btn-ctrl" onclick="moveDrive(-60, -60)">▼</button>
          <div></div>
        </div>
      </div>

      <div class="card">
        <h3>Attachment Arm (Port A)</h3>
        <button class="arm-btn" onclick="moveMotorPort(PORT_A, 50)">RAISE ARM (UP)</button>
        <button class="arm-btn" onclick="moveMotorPort(PORT_A, -50)">LOWER ARM (DOWN)</button>
        <button class="arm-btn" style="background:var(--accent-rose)" onclick="moveMotorPort(PORT_A, 0)">LOCK / STOP ARM</button>
      </div>
    </div>
  </main>

  <script>
    let bleDevice = null;
    let lwpCharacteristic = null;

    // SPIKE Port Mappings
    const PORT_A = 0x00;
    const PORT_B = 0x01;
    const PORT_C = 0x02; // Drive Left
    const PORT_D = 0x03;
    const PORT_E = 0x04; // Drive Right
    const PORT_F = 0x05;

    // LEGO Wireless Protocol v3 Standard UUIDs
    const LWP3_SERVICE_UUID = '00001623-1212-efde-1623-785feabcd123';
    const LWP3_CHAR_UUID    = '00001624-1212-efde-1623-785feabcd123';

    function launchApp() {
      const splash = document.getElementById('splash-screen');
      splash.style.opacity = '0';
      setTimeout(() => splash.style.visibility = 'hidden', 500);
    }

    function switchPage(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      btn.classList.add('active');
    }

    async function connectLegoHub() {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth is not supported on this browser!");
        return;
      }

      try {
        // Try standard device picker with acceptAllDevices first
        try {
          bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              LWP3_SERVICE_UUID,
              '0000fd02-0000-1000-8000-00805f9b34fb',
              'c5f50001-8280-46da-89f4-6d8051e4aeef'
            ]
          });
        } catch (filterErr) {
          // Fallback scan if acceptAllDevices isn't permitted by system
          bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ services: [LWP3_SERVICE_UUID] }]
          });
        }

        if (!bleDevice) return;

        const server = await bleDevice.gatt.connect();
        
        // Retrieve services and find active control characteristic
        let service;
        try {
          service = await server.getPrimaryService(LWP3_SERVICE_UUID);
        } catch (e) {
          const services = await server.getPrimaryServices();
          service = services[0];
        }

        const characteristics = await service.getCharacteristics();
        lwpCharacteristic = characteristics[0];

        document.getElementById('ble-indicator').classList.add('online');
        document.getElementById('ble-text').innerText = "HBOT ONLINE";
        alert("Connected to " + (bleDevice.name || "SPIKE Hub") + "!");

      } catch (err) {
        console.error("BLE Connect Error:", err);
        if (err.name !== 'NotFoundError') {
          alert("Connection note: " + (err.message || err));
        }
      }
    }

    async function moveMotorPort(portHex, speed) {
      if (!lwpCharacteristic) {
        alert("Connect HBOT via Bluetooth first!");
        return;
      }

      const command = new Uint8Array([
        0x08, 0x00, 0x81, portHex, 0x11, 0x51, 0x00, speed & 0xFF
      ]);

      try {
        await lwpCharacteristic.writeValueWithoutResponse(command);
      } catch (e) {
        console.error("Motor write failed:", e);
      }
    }

    async function moveDrive(speedC, speedE) {
      await moveMotorPort(PORT_C, speedC);
      await moveMotorPort(PORT_E, speedE);
    }
  </script>
</body>
</html>
